[workspace]
resolver = "2"
# fuzz/ is a separate cargo-fuzz workspace (nightly only).
exclude = ["fuzz"]
members = [
    "crates/warden-core",
    "crates/warden-identity",
    "crates/warden-audit",
    "crates/warden-mcp",
    "crates/warden-gateway",
    "crates/warden-eval",
    "crates/warden-cli",
    "crates/warden-testkit",
    "crates/warden-wasm",
    "crates/warden-rig",
    "crates/warden-a2a",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/byQuexo/warden"
authors = ["Tim Gühnemann"]

[workspace.dependencies]
warden-core = { path = "crates/warden-core" }
warden-identity = { path = "crates/warden-identity" }
warden-audit = { path = "crates/warden-audit" }
warden-mcp = { path = "crates/warden-mcp" }
warden-gateway = { path = "crates/warden-gateway" }
warden-eval = { path = "crates/warden-eval" }
warden-testkit = { path = "crates/warden-testkit" }
warden-rig = { path = "crates/warden-rig" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
regex = "1"
sqlparser = { version = "0.63", features = ["visitor"] }
unicode-normalization = "0.1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
jsonwebtoken = "9"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tempfile = "3"

[profile.release]
# Handlers rely on unwinding: a panic becomes a deny, the process lives on.
panic = "unwind"

# Small WebAssembly build for the npm package:
#   cargo build --profile wasm --target wasm32-unknown-unknown -p warden-wasm
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
