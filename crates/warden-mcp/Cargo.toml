[package]
name = "warden-mcp"
description = "Model Context Protocol client for the warden gateway, on the official Rust SDK (rmcp)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
futures.workspace = true
http = "1"
reqwest.workspace = true
sse-stream = "0.2.4"
rmcp = { version = "=3.9.0", default-features = false, features = [
    "client",
    # Capability builders are compiled in with the macros feature.
    "macros",
    "transport-streamable-http-client-reqwest",
    "transport-child-process",
    "reqwest",
] }

[dev-dependencies]
axum.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
