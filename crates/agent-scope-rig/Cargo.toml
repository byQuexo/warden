[package]
name = "agent-scope-rig"
description = "agent-scope for rig agents: an AgentHook that checks every tool call against policy (second line of defense next to the gateway)."
version.workspace = true
edition.workspace = true
# rig-agent 0.46 requires a recent toolchain.
rust-version = "1.97"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
agent-scope-core.workspace = true
agent-scope-audit.workspace = true
agent-scope-gateway.workspace = true
serde_json.workspace = true
rig-agent = { version = "=0.46.0", default-features = false }
rig-core = { version = "=0.46.0", default-features = false }

[dev-dependencies]
rig-agent = { version = "=0.46.0", default-features = false, features = ["test-utils"] }
tokio.workspace = true
async-trait.workspace = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
