<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Warden: authorization for AI agents. Every tool call checked against the user, the agent and the arguments.">
  <title>Warden: authorization for AI agents</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.45" stop-color="#1e3a8a"/>
      <stop offset="0.78" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.88" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" opacity="0.12"/></pattern>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <clipPath id="r"><rect width="1280" height="380" rx="18"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.5"/></filter>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <rect width="1280" height="380" fill="url(#g1)"/>
    <rect width="1280" height="380" fill="url(#g2)"/>
    <rect width="1280" height="380" fill="url(#dots)"/>

    <!-- shield with keyhole -->
    <g transform="translate(78,92)" filter="url(#sh)">
      <path d="M70 0 L134 24 V86 C134 132 106 166 70 184 C34 166 6 132 6 86 V24 Z" fill="url(#shield)"/>
      <path d="M70 14 L120 33 V86 C120 124 98 152 70 168 C42 152 20 124 20 86 V33 Z" fill="#0f172a" opacity="0.35"/>
      <circle cx="70" cy="78" r="19" fill="#fff"/>
      <path d="M61 92 H79 L84 128 H56 Z" fill="#fff"/>
    </g>

    <text x="268" y="168" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">warden</text>
    <text x="272" y="222" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#e0e7ff">Authorization for AI agents.</text>
    <text x="272" y="264" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#c7d2fe">Every tool call is checked against the user, the agent</text>
    <text x="272" y="294" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#c7d2fe">and the exact arguments. The model cannot talk its way around it.</text>

    <!-- decision chips -->
    <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">
      <rect x="1010" y="78" width="200" height="44" rx="22" fill="#10b981" fill-opacity="0.9"/>
      <text x="1110" y="106" text-anchor="middle" fill="#fff">ALLOW</text>
      <rect x="1010" y="138" width="200" height="44" rx="22" fill="#f59e0b" fill-opacity="0.92"/>
      <text x="1110" y="166" text-anchor="middle" fill="#fff">REQUIRE APPROVAL</text>
      <rect x="1010" y="198" width="200" height="44" rx="22" fill="#ef4444" fill-opacity="0.9"/>
      <text x="1110" y="226" text-anchor="middle" fill="#fff">DENY</text>
      <text x="1110" y="282" text-anchor="middle" fill="#99f6e4" font-weight="600" font-size="15">MCP · A2A · rig · TypeScript</text>
    </g>
  </g>
</svg>
