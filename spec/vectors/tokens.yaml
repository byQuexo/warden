# Claims -> principal vectors for every preset. `now` is unix seconds.
identity: |
  version: 1
  issuers:
    - { issuer: https://kc.example/realms/acme, audience: https://gw.example/mcp, mapping: { preset: keycloak, attrs: { org_unit: /org_unit, tenants: /tenants } } }
    - { issuer: https://acme.eu.auth0.com/, audience: https://gw.example/mcp, mapping: { preset: auth0 } }
    - { issuer: https://login.microsoftonline.com/tid/v2.0, audience: api://gw, mapping: { preset: entra-id } }
    - { issuer: https://acme.okta.com/oauth2/default, audience: api://gw, mapping: { preset: okta } }
    - { issuer: https://sts.example, audience: https://gw.example/mcp, mapping: { preset: generic-oidc } }
  delegation_issuers: [https://sts.example]
cases:
  - id: keycloak-user
    now: 1000
    claims: { iss: https://kc.example/realms/acme, aud: [https://gw.example/mcp, account], exp: 2000, typ: Bearer, sub: u-1, azp: acme-bot, realm_access: { roles: [hr-lead] }, scope: "openid hr:read", org_unit: hr, tenants: [dach] }
    expect: { ok: { subject: u-1, kind: user, agent: acme-bot, roles: [hr-lead], scopes: ["hr:read", openid], act: [], attrs: { org_unit: hr, tenants: [dach] } } }
  - id: keycloak-service-account
    now: 1000
    claims: { iss: https://kc.example/realms/acme, aud: https://gw.example/mcp, exp: 2000, typ: Bearer, sub: sa-1, azp: acme-bot, preferred_username: service-account-acme-bot }
    expect: { ok: { subject: sa-1, kind: service, agent: acme-bot, roles: [], scopes: [], act: [] } }
  - id: keycloak-id-token-rejected
    now: 1000
    claims: { iss: https://kc.example/realms/acme, aud: https://gw.example/mcp, exp: 2000, typ: ID, sub: u-1, azp: acme-bot }
    expect: { error: token_type }
  - id: expired
    now: 2100
    claims: { iss: https://kc.example/realms/acme, aud: https://gw.example/mcp, exp: 2000, typ: Bearer, sub: u-1, azp: acme-bot }
    expect: { error: expired }
  - id: within-clock-skew
    now: 2020
    claims: { iss: https://kc.example/realms/acme, aud: https://gw.example/mcp, exp: 2000, typ: Bearer, sub: u-1, azp: acme-bot }
    expect: { ok: { subject: u-1, kind: user, agent: acme-bot, roles: [], scopes: [], act: [] } }
  - id: not-yet-valid
    now: 1000
    claims: { iss: https://kc.example/realms/acme, aud: https://gw.example/mcp, exp: 2000, nbf: 1100, typ: Bearer, sub: u-1, azp: acme-bot }
    expect: { error: not_yet_valid }
  - id: wrong-audience
    now: 1000
    claims: { iss: https://kc.example/realms/acme, aud: account, exp: 2000, typ: Bearer, sub: u-1, azp: acme-bot }
    expect: { error: audience }
  - id: unknown-issuer
    now: 1000
    claims: { iss: https://evil.example, aud: https://gw.example/mcp, exp: 2000, sub: u-1, azp: acme-bot }
    expect: { error: unknown_issuer }
  - id: act-from-untrusted-issuer
    now: 1000
    claims: { iss: https://kc.example/realms/acme, aud: https://gw.example/mcp, exp: 2000, typ: Bearer, sub: u-1, azp: acme-action, act: { sub: acme-bot } }
    expect: { error: delegation_issuer }
  - id: generic-delegation-chain
    now: 1000
    claims: { iss: https://sts.example, aud: https://gw.example/mcp, exp: 2000, sub: u-1, azp: acme-action, roles: [sales-rep], scope: "crm:write", act: { sub: acme-research, act: { sub: acme-bot } } }
    expect: { ok: { subject: u-1, kind: user, agent: acme-action, roles: [sales-rep], scopes: ["crm:write"], act: [acme-bot, acme-research] } }
  - id: auth0-user
    now: 1000
    claims: { iss: https://acme.eu.auth0.com/, aud: [https://gw.example/mcp, https://acme.eu.auth0.com/userinfo], exp: 2000, sub: "auth0|42", azp: spa-client, "https://agent-scope.dev/roles": [support], scope: "openid ticket:read" }
    expect: { ok: { subject: "auth0|42", kind: user, agent: spa-client, roles: [support], scopes: [openid, "ticket:read"], act: [] } }
  - id: auth0-client-credentials
    now: 1000
    claims: { iss: https://acme.eu.auth0.com/, aud: https://gw.example/mcp, exp: 2000, sub: "m2m@clients", azp: m2m, gty: client-credentials, scope: "ticket:read" }
    expect: { ok: { subject: "m2m@clients", kind: service, agent: m2m, roles: [], scopes: ["ticket:read"], act: [] } }
  - id: entra-user
    now: 1000
    claims: { iss: https://login.microsoftonline.com/tid/v2.0, aud: "api://gw", exp: 2000, oid: oid-1, sub: pairwise, azp: app-1, roles: [Support.Agent], scp: "Tickets.Read Tickets.Write" }
    expect: { ok: { subject: oid-1, kind: user, agent: app-1, roles: [Support.Agent], scopes: [Tickets.Read, Tickets.Write], act: [] } }
  - id: entra-app-only
    now: 1000
    claims: { iss: https://login.microsoftonline.com/tid/v2.0, aud: "api://gw", exp: 2000, oid: sp-1, appid: daemon, idtyp: app, roles: [Tickets.ReadAll] }
    expect: { ok: { subject: sp-1, kind: service, agent: daemon, roles: [Tickets.ReadAll], scopes: [], act: [] } }
  - id: okta-user
    now: 1000
    claims: { iss: https://acme.okta.com/oauth2/default, aud: "api://gw", exp: 2000, sub: alice@acme.com, cid: 0oa1, groups: [support], scp: [tickets.read] }
    expect: { ok: { subject: alice@acme.com, kind: user, agent: 0oa1, roles: [support], scopes: [tickets.read], act: [] } }
  - id: okta-client-credentials
    now: 1000
    claims: { iss: https://acme.okta.com/oauth2/default, aud: "api://gw", exp: 2000, sub: 0oa9, cid: 0oa9, scp: [tickets.read] }
    expect: { ok: { subject: 0oa9, kind: service, agent: 0oa9, roles: [], scopes: [tickets.read], act: [] } }
  - id: missing-agent
    now: 1000
    claims: { iss: https://sts.example, aud: https://gw.example/mcp, exp: 2000, sub: u-1 }
    expect: { error: missing_claim }
